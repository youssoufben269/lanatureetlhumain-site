# Exemple à adapter au serveur et au certificat réellement installés.
# Ne pas servir le dépôt ni LNH_DATA_DIR avec une directive root/alias.
server {
    listen 443 ssl;
    server_name adhesions.lanatureetlhumain.org;
    ssl_certificate /etc/letsencrypt/live/adhesions.lanatureetlhumain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhesions.lanatureetlhumain.org/privkey.pem;
    client_max_body_size 4400000;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        # Configurer LNH_TRUSTED_PROXY=127.0.0.1 pour ce proxy local contrôlé.
    }
}
